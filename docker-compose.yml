# Полный стенд: сервер (Spring Boot + веб-интерфейс), PostgreSQL и MinIO (S3).
# Запуск:  docker compose up --build
# Сайт:    http://localhost:8080   (admin/admin, client/client)
# MinIO:   http://localhost:9001   (minioadmin/minioadmin)
services:
  db:
    image: postgres:16-alpine
    container_name: library-db
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Официальный образ minio/minio удалён из Docker Hub, используется сборка MinIO от Chainguard
    image: cgr.dev/chainguard/minio:latest
    container_name: library-minio
    user: root
    entrypoint: ["minio"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  app:
    build: .
    container_name: library-app
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://db:5432/library
      DB_USER: library
      DB_PASSWORD: library
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: book-covers
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    restart: on-failure

volumes:
  pgdata:
  miniodata:
