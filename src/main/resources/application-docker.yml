# Профиль для docker compose: PostgreSQL + MinIO (S3)
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/library}
    username: ${DB_USER:library}
    password: ${DB_PASSWORD:library}
  thymeleaf:
    cache: true

app:
  storage:
    type: minio
  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:book-covers}
